# XcodeGen spec: `brew install xcodegen && xcodegen` here creates BusMakro.xcodeproj
# (one SwiftUI app for iPhone and Mac, on top of ../BusMakroKit). Needs the full Xcode.
name: BusMakro
options:
  bundleIdPrefix: com.tassosmak
  developmentLanguage: en
  deploymentTarget: { iOS: "17.0", macOS: "14.0" }
packages:
  BusMakroKit: { path: ../BusMakroKit }
targets:
  BusMakro:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Shared]
    dependencies: [{ package: BusMakroKit }]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: BusMakro
        CFBundleLocalizations: [en, el]
        CFBundleAllowMixedLocalizations: true
        NSLocationWhenInUseUsageDescription: BusMakro uses your location to show the bus stops near you.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait]  # portrait only on iPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tassosmak.busmakro
        DEVELOPMENT_TEAM: LXL43GG782  # personal team (free Apple ID): device builds
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
