# XcodeGen spec: `brew install xcodegen && xcodegen` here creates BusMakro.xcodeproj
# (one SwiftUI app for iPhone and Mac, on top of ../BusMakroKit). Needs the full Xcode.
name: BusMakro
options:
  bundleIdPrefix: com.tassosmak
  developmentLanguage: en
  deploymentTarget: { iOS: "17.0", macOS: "14.0" }
packages:
  BusMakroKit: { path: ../BusMakroKit }
targets:
  BusMakro:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Shared
        excludes: [AppIcon.icon]
      - path: Activity
      - path: Shared/AppIcon.icon  # the app icon, made in Icon Composer (layers: Athens roads, bus)
        type: file
        buildPhase: resources
    entitlements:
      path: BusMakro.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tassosmak.busmakro]  # favourites for the widget
        com.apple.developer.usernotifications.time-sensitive: true  # "wake me at my stop" gets through Focus
    dependencies:
      - package: BusMakroKit
      - target: BusMakroWidgets  # Live Activity (iPhone only)
        destinationFilters: [iOS]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: BusMakro
        CFBundleLocalizations: [en, el]
        CFBundleAllowMixedLocalizations: true
        NSLocationWhenInUseUsageDescription: BusMakro uses your location to show the stops near you, and to keep tracking your bus after you lock the phone while a bus alert is on.
        ITSAppUsesNonExemptEncryption: false  # only HTTPS (exempt): no export documents needed
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UIBackgroundModes: [location]  # keeps bus alerts checking while the app is in the background
        CFBundleURLTypes:  # busmakro://stop/ID, busmakro://line/ID (quick actions, Siri, Spotlight, Live Activity)
          - CFBundleURLName: com.tassosmak.busmakro
            CFBundleURLSchemes: [busmakro]
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait]  # portrait only on iPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tassosmak.busmakro
        DEVELOPMENT_TEAM: LXL43GG782  # Apple Developer Program (Individual)
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only for now (on iPad it runs in iPhone mode); a real iPad layout later
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: 1
  BusMakroWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Activity]
    entitlements:
      path: Widgets/BusMakroWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tassosmak.busmakro]
    dependencies:
      - package: BusMakroKit  # the widget fetches OASA's arrivals itself
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: BusMakro
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tassosmak.busmakro.LiveActivity
        DEVELOPMENT_TEAM: LXL43GG782
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: 1
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  BusMakroUITests:  # Apple's accessibility audit on each main screen
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{ target: BusMakro }]
    settings:
      base:
        DEVELOPMENT_TEAM: LXL43GG782
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BusMakro
schemes:
  BusMakro:  # shared, so a regenerated project still builds from the command line
    build:
      targets:
        BusMakro: all
        BusMakroWidgets: all
    run:
      config: Debug
    test:
      targets: [BusMakroUITests]
