<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>html,body,#map{height:100%;width:100%;margin:0;background:#202124} .maplibregl-map{font:13px -apple-system,BlinkMacSystemFont,sans-serif}
.maplibregl-ctrl-top-left,.maplibregl-ctrl-top-right{margin-top:132px}
.stop-dot{width:12px;height:12px;border-radius:50%;background:#1677ff;border:2px solid white;box-shadow:0 1px 4px #0005;cursor:pointer}
.selected-dot{width:15px;height:15px;border-radius:50%;background:#ff9500;border:3px solid white;box-shadow:0 1px 5px #0007;cursor:pointer}
.bus-wrap{position:relative;width:31px;height:31px;cursor:pointer}
.bus-rot{position:absolute;left:0;top:0;width:31px;height:31px;transition:transform .6s ease}
.bus-arrow{position:absolute;left:50%;top:-9px;margin-left:-6px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid #198754;filter:drop-shadow(0 1px 2px #0006)}
.bus-dot{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;width:27px;height:27px;border-radius:50%;background:#198754;border:2px solid white;color:white;font-size:14px;box-shadow:0 1px 5px #0005}
.bus-dot.labelled{font:700 10px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-.2px}
.bus-wrap.pinned .bus-dot{border-color:#ff9500;box-shadow:0 0 0 3px #ff950066}
.bus-wrap::after{content:'';position:absolute;left:0;top:0;width:27px;height:27px;border-radius:50%;border:2px solid #198754;opacity:0;pointer-events:none}
.bus-wrap.ping::after{animation:ping 1.2s ease-out}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.4);opacity:0}}
.user-dot{width:14px;height:14px;border-radius:50%;background:#0a84ff;border:3px solid white;box-shadow:0 0 0 8px #0a84ff33,0 0 14px 6px #0a84ff22}</style></head><body><div id="map"></div>
<script>
function post(m){try{window.webkit.messageHandlers.oasa.postMessage(m)}catch(e){}}
['log','warn','error'].forEach(k=>{const o=console[k];console[k]=(...a)=>{o.apply(console,a);post({type:'console',level:k,msg:a.map(String).join(' ')})}});
window.addEventListener('error',e=>post({type:'console',level:'error',msg:String(e.message)}));
</script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>
const KEY='__CARTO_KEY__';
const STYLES={light:'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json?key='+KEY,dark:'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json?key='+KEY};
const darkMode=matchMedia('(prefers-color-scheme: dark)');
// Map style: 'system' follows macOS, or 'light' / 'dark' / 'night' (dark + glowing route). Python sets it.
let STYLE_PREF='system',THREE_D=false;
function isDark(){return STYLE_PREF==='system'?darkMode.matches:STYLE_PREF!=='light';}
function isNight(){return STYLE_PREF==='night';}
// CARTO labels use Montserrat; swap in Open Sans, the closest to Apple's SF that CARTO serves glyphs for.
const FONT_SWAP={'Montserrat Medium':'Open Sans Regular','Montserrat SemiBold':'Open Sans Bold',
  'Montserrat Regular Italic':'Open Sans Italic','Montserrat SemiBold Italic':'Open Sans Italic'};
function loadStyle(url){fetch(url).then(r=>r.json()).then(st=>{
  st.layers.forEach(l=>{const tf=l.layout&&l.layout['text-font'];if(Array.isArray(tf))l.layout['text-font']=tf.map(f=>FONT_SWAP[f]||f);});
  map.setStyle(st,{diff:false});
}).catch(e=>{post({type:'error',msg:'style: '+e});map.setStyle(url);});}
const map=new maplibregl.Map({container:'map',style:{version:8,sources:{},layers:[{id:'bg',type:'background',paint:{'background-color':darkMode.matches?'#202124':'#f2f2ef'}}]},center:[23.7275,37.9838],zoom:11,maxPitch:65,attributionControl:false});
let loadedStyle=null;
function applyStyle(){const u=isDark()?STYLES.dark:STYLES.light;if(u!==loadedStyle){loadedStyle=u;loadStyle(u);}else drawExtras();}
applyStyle();
map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
map.addControl(new maplibregl.AttributionControl({compact:true}),'top-left');
map.on('error',e=>post({type:'error',msg:String((e&&e.error&&e.error.message)||e)}));
map.on('load',()=>post({type:'map',msg:'style loaded'}));
map.on('idle',()=>post({type:'map',msg:'idle (all tiles rendered)'}));
darkMode.addEventListener('change',applyStyle);
let stops={},buses={},pinned=null,padB=0,rafOn=false,userM=null;
let routeCoords=null;
// Space taken by the top bar (Python updates it: full screen / expanded map have no bar).
let TOPPAD=116;
window.setTopInset=function(px){TOPPAD=px;document.querySelectorAll('.maplibregl-ctrl-top-left,.maplibregl-ctrl-top-right').forEach(e=>e.style.marginTop=(px+16)+'px');};
// Route line: a road-following shape drawn under the street labels, with an outline (casing).
function drawRoute(){try{
  ['route-line','route-casing'].forEach(id=>{if(map.getLayer(id))map.removeLayer(id)});
  if(map.getSource('route'))map.removeSource('route');
  if(!routeCoords||routeCoords.length<2)return;
  map.addSource('route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:routeCoords}}});
  const below=(map.getStyle().layers.find(l=>l.type==='symbol')||{}).id;
  const dark=isDark();
  map.addLayer({id:'route-casing',type:'line',source:'route',layout:{'line-join':'round','line-cap':'round'},
    paint:{'line-color':dark?'#0b1220':'#ffffff','line-width':['interpolate',['linear'],['zoom'],10,4,15,9,18,14],'line-opacity':0.95}},below);
  map.addLayer({id:'route-line',type:'line',source:'route',layout:{'line-join':'round','line-cap':'round'},
    paint:{'line-color':dark?'#4c9dff':'#1677ff','line-width':['interpolate',['linear'],['zoom'],10,2,15,5,18,8]}},below);
}catch(e){/* style still loading: the 'style.load' handler draws it */}}
// 3D buildings (extruded from the tiles' heights) and the night look (glowing route)
function drawExtras(){try{
  if(map.getLayer('bld-3d'))map.removeLayer('bld-3d');
  if(THREE_D&&map.getSource('protomaps')){
    const h=['coalesce',['get','height'],['*',3.2,['coalesce',['get','building:levels'],['get','levels'],3]]];
    map.addLayer({id:'bld-3d',type:'fill-extrusion',source:'protomaps','source-layer':'buildings',minzoom:14,
      paint:{'fill-extrusion-color':isNight()?'#1b2235':isDark()?'#2b2e36':'#dedbd4','fill-extrusion-height':h,
             'fill-extrusion-base':['coalesce',['get','min_height'],0],'fill-extrusion-opacity':0.85}},
      (map.getStyle().layers.find(l=>l.type==='symbol')||{}).id);
  }
  if(map.getLayer('bg-night'))map.removeLayer('bg-night');
  if(map.getLayer('route-glow'))map.removeLayer('route-glow');
  if(isNight()&&map.getSource('route'))map.addLayer({id:'route-glow',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},
      paint:{'line-color':'#4c9dff','line-width':18,'line-blur':12,'line-opacity':0.55}},'route-casing');
}catch(e){}}
window.setMapStyle=function(s){STYLE_PREF=s||'system';applyStyle();};
window.set3D=function(on){THREE_D=!!on;drawExtras();map.easeTo({pitch:on?55:0,duration:600});};
map.on('style.load',()=>{drawRoute();drawExtras();});  // re-adds route and 3D after a style switch
// Tell Python where the map is looking once it settles (debounced), so it can list stops there.
let moveT=null;
map.on('moveend',()=>{clearTimeout(moveT);moveT=setTimeout(()=>{const c=map.getCenter();post({type:'moved',lat:c.lat,lon:c.lng,zoom:map.getZoom()});},350);});
window.setRoute=function(latlon){routeCoords=latlon&&latlon.length?latlon.map(p=>[p[1],p[0]]):null;drawRoute();drawExtras();};
function mk(cls,text,lon,lat,title,z){const el=document.createElement('div');el.className=cls;if(text)el.textContent=text;el.title=title||'';el.style.zIndex=z||0;const m=new maplibregl.Marker({element:el}).setLngLat([lon,lat]).addTo(map);return {m,el};}
function clear(o){Object.values(o).forEach(x=>x.m.remove());return {}}
window.setStops=function(items,selectedId,fit,padBottom){
  stops=clear(stops);
  items.forEach(s=>{if(s.lat==null||s.lon==null)return;const sel=s.id===selectedId;const x=mk(sel?'selected-dot':'stop-dot','',s.lon,s.lat,s.name,sel?1000:0);x.el.addEventListener('click',ev=>{ev.stopPropagation();post({type:'stop',id:String(s.id)})});stops[String(s.id)]=x;});
  if(fit&&items.length){const b=new maplibregl.LngLatBounds();items.forEach(s=>{if(s.lat!=null&&s.lon!=null)b.extend([s.lon,s.lat])});if(!b.isEmpty())map.fitBounds(b,{padding:{top:TOPPAD+30,left:30,right:30,bottom:(padBottom||0)+30},duration:600,maxZoom:15});}
};
function bearing(a,b){const r=Math.PI/180,y=Math.sin((b[0]-a[0])*r)*Math.cos(b[1]*r);const x=Math.cos(a[1]*r)*Math.sin(b[1]*r)-Math.sin(a[1]*r)*Math.cos(b[1]*r)*Math.cos((b[0]-a[0])*r);return (Math.atan2(y,x)/r+360)%360;}
// ---- Buses ----------------------------------------------------------------------------
// As the athens-transit-rt contract says: from each GPS fix (position_at), drive the marker along
// `path` then `path_beyond` (the road ahead) at `path_speeds` (per 200 m; a missing step at `speed`,
// or 1.5 m/s) and stop at the end of the known road. A new fix blends in from where the marker is
// drawn; a huge gap fades and snaps instead of gliding through buildings; an older fix is ignored.
const BLEND_MS=1500, SNAP_M=400, STALE_S=120;
const MAX_DR_S=90;  // never extrapolate further than this past the GPS fix (about one update gap)
let followAfter=0;  // a pinned bus is followed every frame once the pin's zoom animation is done
// jumpTo cancels a zoom in progress, so following pauses while the user zooms (and a moment after);
// otherwise every frame cuts the zoom off and the map pulses in and out.
let userZoomUntil=0;
['zoomstart','zoom','wheel'].forEach(ev=>map.on(ev,e=>{if(e.originalEvent)userZoomUntil=performance.now()+400;}));
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function metres(a,b){const k=Math.cos(a[1]*Math.PI/180);return Math.hypot((b[0]-a[0])*k,b[1]-a[1])*111320;}
function mkRoute(b){
  const pts=[].concat(b.path||[],(b.path_beyond||[]).slice(b.path&&b.path.length?1:0)).map(p=>[p[1],p[0]]);
  if(pts.length<2)return null;
  const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+metres(pts[i-1],pts[i]));
  // only a bus that is actually moving is driven along its road; standing (0) or unknown (null) stays put
  const moving=typeof b.speed==='number'&&b.speed>0;
  return {pts,cum,total:cum[cum.length-1],speeds:b.path_speeds||[],speed:moving?b.speed:null,moving};
}
function travelled(r,secs){  // metres along the route after `secs` seconds
  let d=0,t=secs;
  for(let i=0;d<r.total;i++){
    const seg=Math.min(200,r.total-d),v=r.speeds[i]||r.speed||1.5,dt=seg/v;
    if(t<=dt)return d+t*v;
    d+=seg;t-=dt;
  }
  return r.total;
}
function pointAt(r,d){  // [lon,lat] and road heading at d metres along the route
  let i=1;while(i<r.pts.length-1&&r.cum[i]<d)i++;
  const a=r.pts[i-1],b=r.pts[i],seg=r.cum[i]-r.cum[i-1],f=seg>0?Math.min(1,Math.max(0,(d-r.cum[i-1])/seg)):1;
  return {p:[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f],hdg:bearing(a,b)};
}
function estimate(x,nowS){  // where the bus should be now, from its last fix
  if(!x.route)return {p:x.fix,hdg:x.hdg};
  const age=nowS-x.fixAt;
  // standing/unknown-speed buses stay at their real position; moving ones drive on for at most
  // MAX_DR_S and then wait there (a stale bus is only faded, never snapped back)
  const secs=x.route.moving?Math.min(Math.max(0,age),MAX_DR_S):0;
  return pointAt(x.route,travelled(x.route,secs));
}
function turn(x,hdg){if(hdg==null)return;const d=((hdg-x.angle+540)%360)-180;if(Math.abs(d)<0.5)return;x.angle+=d;x.rot.style.transform='rotate('+x.angle+'deg)';x.rot.style.opacity=1;}
function step(now){
  const nowS=Date.now()/1000;let active=false;
  Object.values(buses).forEach(x=>{
    const est=estimate(x,nowS);
    let p=est.p;
    const t=Math.min(1,(now-x.blendT0)/BLEND_MS);
    if(t<1){const e=ease(t);p=[x.blendFrom[0]+(p[0]-x.blendFrom[0])*e,x.blendFrom[1]+(p[1]-x.blendFrom[1])*e];active=true;}
    if(x.route&&x.route.moving&&nowS-x.fixAt<MAX_DR_S)active=true;  // still driving along its road
    x.cur=p;x.m.setLngLat(p);turn(x,est.hdg);
    // faded: no fresh GPS for a while, or not on its route (waiting at the depot/terminus to start)
    x.el.style.opacity=(nowS-x.fixAt>STALE_S||x.offRoute)?0.45:1;
  });
  if(pinned&&buses[pinned]&&now>followAfter&&now>userZoomUntil&&!map.isZooming())map.jumpTo({center:buses[pinned].cur,padding:{top:TOPPAD,left:0,right:0,bottom:padB}});
  if(active&&!paused)requestAnimationFrame(step);else rafOn=false;
}
let paused=false;  // window hidden: no drawing (Python resumes it)
window.setPaused=function(p){paused=!!p;if(!paused)kick();};
function kick(){if(rafOn||paused)return;rafOn=true;requestAnimationFrame(step);}
function mkBus(id,to){const el=document.createElement('div');el.className='bus-wrap';el.title='Bus '+id;el.style.zIndex=2000;el.style.transition='opacity .4s';el.innerHTML='<div class="bus-rot"><div class="bus-arrow"></div></div><div class="bus-dot">🚌</div>';const m=new maplibregl.Marker({element:el}).setLngLat(to).addTo(map);el.addEventListener('click',ev=>{ev.stopPropagation();post({type:'bus',id:id})});return {m,el,rot:el.querySelector('.bus-rot'),cur:to,fix:to,fixAt:0,route:null,blendFrom:to,blendT0:0,angle:0,hdg:null};}
window.setBuses=function(items){
  const seen=new Set(),nowS=Date.now()/1000,nowMs=performance.now();
  items.forEach(b=>{if(b.lat==null||b.lon==null)return;const id=String(b.id),fix=[b.lon,b.lat];seen.add(id);
    const at=b.position_at||nowS;
    let x=buses[id];
    if(!x){x=buses[id]=mkBus(id,fix);if(b.label){const d=x.el.querySelector('.bus-dot');d.textContent=b.label;d.classList.add('labelled');x.el.title='Bus '+id+' · '+b.label;}}
    else if(at<x.fixAt)return;  // an older fix than the one we have: ignore it
    if(at>x.fixAt&&x.fixAt){x.el.classList.remove('ping');void x.el.offsetWidth;x.el.classList.add('ping');}  // fresh GPS fix: a ring ripples out
    x.fix=fix;x.fixAt=at;x.route=mkRoute(b);x.offRoute=!b.path&&!b.path_beyond;  // the API leaves both empty off-route
    if(typeof b.heading==='number'&&!isNaN(b.heading))x.hdg=b.heading;
    const target=estimate(x,nowS).p;
    if(metres(x.cur,target)>SNAP_M){  // long GPS gap: fade and snap, never glide through blocks
      x.el.style.opacity=0;x.cur=target;x.m.setLngLat(target);x.blendFrom=target;x.blendT0=0;
      setTimeout(()=>{x.el.style.opacity=1;},60);
    }else{x.blendFrom=x.cur;x.blendT0=nowMs;}
    x.el.classList.toggle('pinned',id===pinned);
  });
  Object.keys(buses).forEach(id=>{if(!seen.has(id)){buses[id].m.remove();delete buses[id];}});
  kick();
};
window.setPinned=function(id,pb){pinned=id||null;padB=pb||0;Object.keys(buses).forEach(k=>buses[k].el.classList.toggle('pinned',k===pinned));if(pinned&&buses[pinned]){followAfter=performance.now()+750;map.easeTo({center:buses[pinned].cur,zoom:Math.max(map.getZoom(),15),duration:700,padding:{top:TOPPAD,left:0,right:0,bottom:padB}});kick();}};
map.on('dragstart',()=>{if(pinned){pinned=null;Object.values(buses).forEach(x=>x.el.classList.remove('pinned'));post({type:'unpin'});}});
window.setUser=function(lat,lon){const to=[lon,lat];if(!userM){const el=document.createElement('div');el.className='user-dot';el.style.zIndex=900;userM=new maplibregl.Marker({element:el}).setLngLat(to).addTo(map);}else userM.setLngLat(to);};
window.getCenter=function(){const c=map.getCenter();return JSON.stringify({lat:c.lat,lon:c.lng});};
window.focusStop=function(lat,lon,zoom,padBottom){map.flyTo({center:[lon,lat],zoom:zoom||16,duration:500,padding:{top:TOPPAD,left:0,right:0,bottom:padBottom||0}});};
</script></body></html>
