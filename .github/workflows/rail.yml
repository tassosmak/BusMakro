# Weekly: rebuild the metro/tram timetable from STASY's GTFS feed (data.gov.gr) and publish it
# with the website (docs/rail.json on the swiftui branch), where the app picks it up.
name: Rail timetable
on:
  schedule:
    - cron: "17 4 * * 1"  # Mondays, 04:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: swiftui
      - name: Download STASY's feed
        run: curl -sSfL -o /tmp/stasy_gtfs.zip "https://data.gov.gr/dataset/4e897a75-975a-4ce7-af65-f32ea01f93b9/resource/5e3858ee-d9ba-48c2-9015-744ea160976d/download/stasy_gtfs.zip"
      - name: Build rail.json
        run: python3 swift/tools/build_rail.py /tmp/stasy_gtfs.zip docs/rail.json
      - name: Publish if changed
        run: |
          git diff --quiet docs/rail.json && { echo "No change"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rail.json
          git commit -m "Metro/tram timetable rebuilt from STASY's feed"
          git push
